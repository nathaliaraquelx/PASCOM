name: Publicar notícias (Google Docs)

on:
  schedule:
    # A cada 2 horas
    - cron: "20 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Substitua pelo URL de publicação em CSV da Google Sheet "índice" de
  # notícias — ver README.md, secção "Notícias (artigos completos)".
  NOTICIAS_SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV3iVMPel9XJKxW9GHtkbxcNRWbXUWk6R0BurMksOJ8nU-Nwy3uzuJT0jzwvsii8wg_COlAjMKMVDd/pub?gid=0&single=true&output=csv"

jobs:
  publicar-noticias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: pip install --quiet beautifulsoup4

      - name: Gerar artigos e atualizar a secção Notícias
        run: python3 scripts/gerar-noticias.py "$NOTICIAS_SHEET_CSV_URL"

      - name: Commit e push (se houver alterações)
        run: |
          git config user.name "PASCOM Bot"
          git config user.email "actions@github.com"
          git add index.html noticias/ sitemap.xml
          if git diff --staged --quiet; then
            echo "Sem alterações — nada a comitar."
            exit 0
          fi
          git commit -m "Publicar notícias"
          for tentativa in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (outra atualização automática chegou primeiro) — a tentar de novo ($tentativa/5)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((RANDOM % 10 + 3))
          done
          echo "Não foi possível fazer push depois de várias tentativas." >&2
          exit 1
