name: Publicar galeria de imagens (Google Docs)

on:
  schedule:
    # A cada 2 horas
    - cron: "40 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Substitua pelo URL de publicação em CSV da Google Sheet "índice" da
  # galeria — ver README.md, secção "Galeria de Imagens".
  GALERIA_SHEET_CSV_URL: "SEU_CSV_URL_AQUI"

jobs:
  publicar-galeria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: pip install --quiet beautifulsoup4

      - name: Gerar js/galeria.js a partir da Google Sheet
        run: python3 scripts/gerar-galeria.py "$GALERIA_SHEET_CSV_URL"

      - name: Commit e push (se houver alterações)
        run: |
          git config user.name "PASCOM Bot"
          git config user.email "actions@github.com"
          git add js/galeria.js assets/img/galeria/
          if git diff --staged --quiet; then
            echo "Sem alterações — nada a comitar."
            exit 0
          fi
          git commit -m "Publicar galeria de imagens"
          for tentativa in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejeitado (outra atualização automática chegou primeiro) — a tentar de novo ($tentativa/5)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((RANDOM % 10 + 3))
          done
          echo "Não foi possível fazer push depois de várias tentativas." >&2
          exit 1
